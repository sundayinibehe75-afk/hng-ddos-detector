user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Trust Docker internal network and AWS VPC ranges for X-Forwarded-For
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  192.168.0.0/16;
    # AWS ALB / CloudFront IP ranges (common)
    set_real_ip_from  3.0.0.0/8;
    set_real_ip_from  52.0.0.0/8;
    set_real_ip_from  54.0.0.0/8;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # JSON access log format
    log_format json_combined escape=json
        '{'
            '"source_ip":"$remote_addr",'
            '"timestamp":"$time_iso8601",'
            '"method":"$request_method",'
            '"path":"$request_uri",'
            '"status":$status,'
            '"response_size":$body_bytes_sent,'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"request_time":$request_time'
        '}';

    access_log  /var/log/nginx/hng-access.log  json_combined;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 80;
        server_name _;

        client_max_body_size 512M;

        location / {
            proxy_pass         http://nextcloud:80;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }
    }
}
