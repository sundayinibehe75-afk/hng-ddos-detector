version: "3.8"

networks:
  hng-net:
    driver: bridge

volumes:
  HNG-nginx-logs:
    name: HNG-nginx-logs
  nextcloud_data:

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    networks:
      - hng-net
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - HNG-nginx-logs:/var/log/nginx
    depends_on:
      - nextcloud
    restart: unless-stopped

  nextcloud:
    image: kefaslungu/hng-nextcloud
    networks:
      - hng-net
    volumes:
      - nextcloud_data:/var/www/html
      - HNG-nginx-logs:/var/log/nginx:ro
    environment:
      - NEXTCLOUD_TRUSTED_DOMAINS=${EC2_PUBLIC_IP}
    restart: unless-stopped

  detector:
    build:
      context: ./detector
      dockerfile: Dockerfile
    volumes:
      - HNG-nginx-logs:/var/log/nginx:ro
      - ./detector/config.yaml:/app/config.yaml:ro
      - /var/log/detector:/var/log/detector
    # host network so iptables rules apply to the actual host firewall,
    # not just the container's network namespace
    network_mode: host
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    depends_on:
      - nginx
